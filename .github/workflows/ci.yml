name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test watcher
        run: bun test watch-pr/*.test.ts
      - name: Typecheck watcher
        run: bun run typecheck
